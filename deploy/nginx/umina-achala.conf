server {
    server_name umina-achala.pe;

    root /home/ubuntu/umina-achala-web/build;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/umina-achala.access.log;
    error_log  /var/log/nginx/umina-achala.error.log;

    # never cache the page itself, so a deploy shows up straight away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # hashed build files: safe to cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the catalog, rebuilt from the chain (#89): always revalidate, so a new
    # catalog shows on the next page load; a missing one is a 404, not the page
    location = /data/catalog.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # copies of photos, 3D models and PDFs, one folder per IPFS CID
    # (umina-achala-chain#45, #46): an IPFS file never changes, so neither
    # does its copy
    location /data/media/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # mime.types has no .glb; PDFs are application/pdf already
        location ~ \.glb$ {
            types { }
            default_type model/gltf-binary;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/umina-achala.pe/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/umina-achala.pe/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name www.umina-achala.pe;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/umina-achala.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umina-achala.pe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://umina-achala.pe$request_uri;
}

server {
    if ($host = www.umina-achala.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = umina-achala.pe) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name umina-achala.pe www.umina-achala.pe;
    return 404; # managed by Certbot
}
